name: Publish LinkedLOL

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'search.mjs'
      - 'favicon.svg'
      - 'build.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout images and their creation history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate image catalog and thumbnails
        run: python build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
